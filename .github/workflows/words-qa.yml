name: Their words test (made-up résumés)

# Read-only test of "Say it in their words": runs the real tool on made-up résumés against
# real jobs and stores the answers in words_qa. The site is untouched.
on:
  workflow_dispatch:
  push:
    branches: [qa-their-words, qa-fit, qa-demo]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QA_MODE: ${{ github.ref_name == 'qa-fit' && 'fit' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: github.ref_name != 'qa-demo'
        run: npx tsx --conditions=react-server scripts/qa/their-words.ts
      - if: github.ref_name == 'qa-demo'
        run: npx tsx --conditions=react-server scripts/qa/demo.ts
        env:
          DEMO_STEP: ${{ hashFiles('scripts/qa/demo-answers.json') != '' && 'rest' || 'fit' }}
