name: Backfill AI summaries

# Run by hand after adding ANTHROPIC_API_KEY, or any time summaries are missing.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max jobs to process"
        default: "3000"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run backfill -- ${{ inputs.limit }}
