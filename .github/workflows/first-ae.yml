name: Tag first AE jobs

# Catch-up: tag AE jobs open to a first-time AE. New jobs are checked by the crawler.
on:
  # Runs once when this file or the script lands on main; it only touches jobs not yet checked, so re-runs are harmless.
  push:
    branches: [main]
    paths: [".github/workflows/first-ae.yml", "scripts/first-ae-backfill.ts"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report, don't change anything"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/first-ae-backfill.ts ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
