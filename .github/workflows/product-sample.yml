name: Product description test

# Read-only test: writes a plain-English "what they sell" for sampled companies, stores answers in product_samples. The site is untouched.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many companies to sample"
        default: "50"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/product-sample.ts ${{ inputs.count }}
