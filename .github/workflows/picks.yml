name: Braun's Picks (manual)

# Scheduled runs live in hourly.yml. Use this to build, rebuild or send by hand.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "draft, rebuild (replace an unedited draft) or send"
        type: choice
        options: [draft, rebuild, send]
        default: draft

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      PICKS_POSTAL_ADDRESS: ${{ secrets.PICKS_POSTAL_ADDRESS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build next issue + preview
        if: inputs.step == 'draft'
        run: npm run picks:draft
      - name: Rebuild unedited draft
        if: inputs.step == 'rebuild'
        run: npm run picks:draft -- --rebuild
      - name: Send due issues
        if: inputs.step == 'send'
        run: npm run picks:send
