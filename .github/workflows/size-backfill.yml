name: Company size backfill

# Size every hiring company that needs it. The hourly run handles new companies after this.
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Max companies"
        default: "250"
      retry_unknown:
        description: "Ask again about companies we couldn't size (yes/no)"
        default: "no"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/size-backfill.ts ${{ inputs.max }} ${{ inputs.retry_unknown == 'yes' && '--retry-unknown' || '' }}
