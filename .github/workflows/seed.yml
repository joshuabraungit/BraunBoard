name: Seed companies

# Run by hand (Actions tab > Seed companies > Run workflow) to load a company CSV,
# detect each company's ATS, then pull jobs for anything not crawled recently.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Company CSV to load"
        default: data/seed-companies.csv

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seed -- ${{ inputs.file }}
      - run: npm run ingest
