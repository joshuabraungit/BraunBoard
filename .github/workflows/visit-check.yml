name: visit-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1 && npx playwright install chromium
      - run: |
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage();
            const sent = []; p.on('request', r => { if (r.url().includes('/api/v')) sent.push(r.method() + ' ' + r.url()); });
            const errs = []; p.on('pageerror', e => errs.push(e.message)); p.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
            await p.goto('https://www.braunboard.com/kit?utm_source=qa-browser', { waitUntil: 'networkidle' });
            await p.waitForTimeout(3000);
            console.log(`::notice::beacons: ${sent.length} ${sent.join(' ')} | errors: ${errs.slice(0,3).join(' / ')}`);
            await b.close();
          })();
          JS
          node t.js
