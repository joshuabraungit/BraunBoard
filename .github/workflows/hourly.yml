name: Hourly

# One runner for everything on a schedule. GitHub's cron skips most runs on busy days,
# so each run queues the next one itself about an hour later (the cron below only
# restarts the chain if it ever breaks). Each step only does what's due:
#  - crawl companies not checked in ~4 hours (+ instant alerts)
#  - find "who you're selling to" for new jobs
#  - the daily alert digest, once a day, first run after 8am ET
#  - build Braun's Picks Monday afternoon, send it Tuesday at 8am ET
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALERTS_LINK_SECRET: ${{ secrets.ALERTS_LINK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Note start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crawl what's due + instant alerts
        run: npm run ingest -- --stale 3.5
      - name: Who you're selling to (new jobs)
        if: always()
        run: npx tsx scripts/buyer-backfill.ts 300
      - name: What they sell (new and stale companies)
        if: always()
        run: npx tsx scripts/product-backfill.ts 40
      - name: Daily digest (if due)
        if: always()
        run: npm run digest -- --if-due
      - name: Build Braun's Picks (if due)
        if: always()
        run: npm run picks:draft -- --if-due
      - name: Send Braun's Picks (if due)
        if: always()
        run: npm run picks:send
      # Keeps the hourly rhythm: wait out the rest of the hour, then queue the next run.
      # Only one run can be waiting at a time, so this never multiplies.
      - name: Queue the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          wait=$(( 3300 - elapsed ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run hourly.yml --ref main -R "${{ github.repository }}"
